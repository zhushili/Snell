name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: snell.sh 与 src/ 一致
        run: ./build.sh --check
      - name: ShellCheck
        run: shellcheck -S style snell.sh build.sh
      - name: 语法检查
        run: bash -n snell.sh
      - name: 操作锁回归测试
        run: python3 tests/test_locking.py
